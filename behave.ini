[behave]
# Behave configuration for HITL pipeline tests

# Default formatter
default_format = pretty

# Show timings
show_timings = true

# Stop on first failure (useful for debugging)
stop_on_failure = false

# Show snippets for undefined steps
show_snippets = true

# Capture output
stdout_capture = true
stderr_capture = true

# Logging
log_capture = true
logging_level = INFO

# JUnit output for CI/CD
junit = true
junit_directory = test-results/

# Paths
paths = tests/features/

# Tags to exclude by default
# skip_tags = wip,manual

[behave.formatters]
# Additional formatters
json = behave.formatters.json_formatter:JSONFormatter
junit = behave.formatters.junit_formatter:JUnitFormatter
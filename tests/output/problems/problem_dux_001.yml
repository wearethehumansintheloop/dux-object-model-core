job_statement: When I'm trying to optimize my product strategy by identifying high-impact
  opportunities for user-centric innovation, I want a clear and actionable understanding
  of the unmet needs and pain points that drive frustration, so I can prioritize investments
  in solutions that drive meaningful value and competitive advantage.

name: HITL Pipeline Regression Tests

on:
  push:
    branches: [ main, research_object_validation ]
    paths:
      - 'scripts/validation/**'
      - 'scripts/docling/**'
      - 'tests/features/hitl_pipeline.feature'
      - 'tests/steps/test_hitl_pipeline.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/validation/**'
      - 'scripts/docling/**'

jobs:
  test-hitl-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install behave pytest
        # Install project dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Create test folders
      run: |
        mkdir -p watch_folders/{hitl_review,hitl_review_queue,hitl_review_rejected}
        mkdir -p watch_folders/{hitl_rejected,hitl_failed,hitl_workshop,hitl_promotion_candidates}
    
    - name: Run HITL BDD tests
      run: |
        behave tests/features/hitl_pipeline.feature --junit --junit-directory test-results
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: test-results/
    
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: HITL Pipeline Tests
        path: 'test-results/*.xml'
        reporter: java-junit